$kind: http-request
url: "{{baseUrl}}/api/v1/orders"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 401', function () {
          pm.response.to.have.status(401);
      });
      pm.test('Error names the failure', function () {
          pm.expect(pm.response.json().error.name).to.eql('unauthorized');
      });
    language: text/javascript
order: 6000
