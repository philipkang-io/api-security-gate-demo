$kind: http-request
url: "{{baseUrl}}/api/v1/orders/{{orderId}}"
method: GET
headers:
  Authorization: "Bearer {{aliceToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Returns the created order', function () {
          const json = pm.response.json();
          pm.expect(json.order.id).to.eql(pm.collectionVariables.get('orderId'));
          pm.expect(json.order.status).to.eql('open');
      });
    language: text/javascript
order: 3000
