$kind: http-request
url: "{{baseUrl}}/api/v1/orders/{{orderId}}"
method: PUT
headers:
  Authorization: "Bearer {{aliceToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "customer": "Contract Test Co (updated)"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Customer is updated', function () {
          pm.expect(pm.response.json().order.customer).to.eql('Contract Test Co (updated)');
      });
    language: text/javascript
order: 4000
