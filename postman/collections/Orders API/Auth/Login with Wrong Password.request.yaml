$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{aliceEmail}}",
      "password": "not-the-password"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 401', function () {
          pm.response.to.have.status(401);
      });
      pm.test('Error names the failure', function () {
          pm.expect(pm.response.json().error.name).to.eql('unauthorized');
      });
    language: text/javascript
order: 2000
