$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{aliceEmail}}",
      "password": "wrong-guess-6"
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.request.headers.upsert({ key: 'X-Forwarded-For', value: '10.77.0.6' });
    language: text/javascript
  - type: afterResponse
    code: |-
      const seen = pm.collectionVariables.get('throttleStatuses');
      pm.collectionVariables.set('throttleStatuses', (seen ? seen + ',' : '') + pm.response.code);
    language: text/javascript
order: 6000
