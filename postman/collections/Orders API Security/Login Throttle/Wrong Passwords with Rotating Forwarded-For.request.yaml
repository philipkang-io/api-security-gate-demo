$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{aliceEmail}}",
      "password": "wrong-guess-0"
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.request.headers.upsert({ key: 'X-Forwarded-For', value: '10.77.0.1' });
    language: text/javascript
  - type: afterResponse
    code: |-
      // Seven wrong guesses in total, each claiming a different client address.
      // A throttle keyed on the real connection must trip within 60 seconds.
      const statuses = [pm.response.code];
      const base = pm.environment.get('baseUrl');
      function attempt(n, done) {
          if (n > 6) { return done(); }
          pm.sendRequest({
              url: base + '/auth/login',
              method: 'POST',
              header: { 'Content-Type': 'application/json', 'X-Forwarded-For': '10.77.0.' + (n + 1) },
              body: { mode: 'raw', raw: JSON.stringify({ email: pm.environment.get('aliceEmail'), password: 'wrong-guess-' + n }) }
          }, function (err, res) {
              statuses.push(err ? 0 : res.code);
              attempt(n + 1, done);
          });
      }
      attempt(1, function () {
          pm.test('Login is throttled even when X-Forwarded-For changes (got ' + statuses.join(',') + ')', function () {
              pm.expect(statuses).to.include(429);
          });
      });
    language: text/javascript
order: 1000
