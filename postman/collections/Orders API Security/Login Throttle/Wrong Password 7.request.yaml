$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{aliceEmail}}",
      "password": "wrong-guess-7"
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.request.headers.upsert({ key: 'X-Forwarded-For', value: '10.77.0.7' });
    language: text/javascript
  - type: afterResponse
    code: |-
      const seen = pm.collectionVariables.get('throttleStatuses');
      pm.collectionVariables.set('throttleStatuses', (seen ? seen + ',' : '') + pm.response.code);
      const statuses = pm.collectionVariables.get('throttleStatuses').split(',').map(Number);
      // A throttle keyed on the real connection must trip within 60 seconds, whatever the header says.
      pm.test('Login is throttled even when X-Forwarded-For changes (got ' + statuses.join(',') + ')', function () {
          pm.expect(statuses).to.include(429);
      });
    language: text/javascript
order: 7000
