$kind: http-request
url: "{{baseUrl}}/api/v1/orders/{{aliceOrderA}}"
method: PUT
headers:
  Authorization: "Bearer {{bobToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "cancelled"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Tenant B cannot modify a tenant A order (403 or 404)', function () {
          pm.expect(pm.response.code).to.be.oneOf([403, 404]);
      });
    language: text/javascript
order: 2000
