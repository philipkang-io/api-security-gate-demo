$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{bobEmail}}",
      "password": "{{bobPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Save bob token', function () {
          pm.collectionVariables.set('bobToken', pm.response.json().token);
      });
    language: text/javascript
order: 2000
