$kind: http-request
url: "{{baseUrl}}/api/v1/orders/{{aliceOrderB}}"
method: DELETE
headers:
  Authorization: "Bearer {{aliceToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Delete returns 200 or 404 (no server error)', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 404]);
      });
    language: text/javascript
order: 2000
