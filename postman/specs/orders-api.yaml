openapi: 3.1.0
info:
  title: Orders API
  description: Multi-tenant orders service. Callers sign in with an email and password, receive a bearer token, and can then
    list, create, read, update and delete orders that belong to their own tenant.
  version: 1.0.0
  contact:
    name: Philip Kang
    email: philip.kang@postman.com
servers:
- url: http://localhost:3000
  description: Local development server
tags:
- name: System
  description: Service health.
- name: Auth
  description: Sign in to obtain a bearer token.
- name: Orders
  description: Orders that belong to the caller's tenant.
security:
- bearerAuth: []
paths:
  /health:
    get:
      summary: Health check
      description: Returns the service status and the current server time.
      operationId: healthCheck
      tags:
      - System
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                timestamp: '2026-10-28T09:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      summary: Sign in
      description: Exchanges an email and password for a bearer token valid for one hour. Repeated attempts from the same
        client are throttled.
      operationId: login
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: alice@acme-corp.test
              password: alice-demo-pw
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
                expiresIn: 3600
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orders:
    get:
      summary: List orders
      description: Lists the orders that belong to the caller's tenant.
      operationId: listOrders
      tags:
      - Orders
      responses:
        '200':
          description: Orders for the caller's tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create an order
      description: Creates an order in the caller's tenant. The tenant is taken from the bearer token, never from the request
        body.
      operationId: createOrder
      tags:
      - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
            example:
              customer: Acme Retail
              items:
              - sku: KB-01
                qty: 4
              total: 320
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orders/{id}:
    parameters:
    - $ref: '#/components/parameters/OrderId'
    get:
      summary: Get an order
      description: Returns one order. The order must belong to the caller's tenant.
      operationId: getOrder
      tags:
      - Orders
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      summary: Update an order
      description: Updates the customer, items, total or status of an order in the caller's tenant. The order id and tenant
        cannot be changed.
      operationId: updateOrder
      tags:
      - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
            example:
              customer: Acme Retail (updated)
      responses:
        '200':
          description: Order updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete an order
      description: Deletes an order in the caller's tenant.
      operationId: deleteOrder
      tags:
      - Orders
      responses:
        '200':
          description: Order deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token returned by POST /auth/login.
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      description: Order identifier.
      schema:
        $ref: '#/components/schemas/OrderIdentifier'
  responses:
    Unauthorized:
      description: Missing, invalid or expired bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such order in the caller's tenant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    HealthResponse:
      type: object
      required:
      - status
      - timestamp
      properties:
        status:
          type: string
          examples:
          - ok
        timestamp:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required:
      - email
      - password
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    LoginResponse:
      type: object
      required:
      - token
      - expiresIn
      properties:
        token:
          type: string
        expiresIn:
          type: integer
          examples:
          - 3600
    OrderItem:
      type: object
      required:
      - sku
      - qty
      properties:
        sku:
          type: string
          examples:
          - KB-01
        qty:
          type: integer
          minimum: 1
    Order:
      type: object
      required:
      - id
      - tenantId
      - customer
      - items
      - total
      - status
      - createdAt
      properties:
        id:
          type: string
          description: Server-assigned order identifier.
          readOnly: true
        tenantId:
          type: string
          description: Tenant that owns the order, set by the server from the token.
          readOnly: true
        customer:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total:
          type: number
        status:
          type: string
          examples:
          - open
        createdAt:
          type: string
          format: date-time
          readOnly: true
    OrderInput:
      type: object
      required:
      - customer
      - items
      - total
      additionalProperties: false
      properties:
        customer:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total:
          type: number
    OrderUpdate:
      type: object
      additionalProperties: false
      properties:
        customer:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total:
          type: number
        status:
          type: string
    OrderResponse:
      type: object
      required:
      - order
      properties:
        order:
          $ref: '#/components/schemas/Order'
    OrderListResponse:
      type: object
      required:
      - orders
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
    DeleteResponse:
      type: object
      required:
      - message
      - id
      properties:
        message:
          type: string
          examples:
          - Order deleted
        id:
          type: string
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - name
          - message
          properties:
            name:
              type: string
              examples:
              - unauthorized
            message:
              type: string
    OrderIdentifier:
      type: string
      description: Order identifier.
      examples:
      - ord-1001
